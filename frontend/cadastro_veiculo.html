<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Veículo · ChargeGrid Intelligence</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  {% include 'partials/_navbar_minima.html' %}

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 460px;">
      <span class="badge-step">CONTA CRIADA COM SUCESSO</span>
      <h2>Quer cadastrar seu veículo agora?</h2>
      <p class="subtitle">A capacidade da bateria é usada para calcular tempo e custo de carregamento automaticamente.
      </p>

      <form id="form-veiculo">
        <div class="form-row">
          <div class="form-group">
            <label for="marca">Marca</label>
            <input type="text" id="marca" name="marca" placeholder="Ex: BYD">
          </div>
          <div class="form-group">
            <label for="modelo">Modelo</label>
            <input type="text" id="modelo" name="modelo" placeholder="Ex: Dolphin">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="placa">Placa</label>
            <input type="text" id="placa" name="placa" placeholder="Ex: ABC1D23">
          </div>
          <div class="form-group">
            <label for="ano">Ano</label>
            <input type="number" id="ano" name="ano" placeholder="Ex: 2024" min="1990" max="2030">
          </div>
        </div>
        <div class="form-group">
          <label for="capacidade">Capacidade da bateria (kWh)</label>
          <input type="number" id="capacidade" step="0.1" placeholder="Ex: 44.9">
        </div>

        <div class="choice-actions">
          <button type="button" id="mais-tarde" class="btn btn-outline btn-full">Mais tarde</button>
          <button type="submit" class="btn btn-primary btn-full">Cadastrar agora</button>
        </div>
        <div id="mensagem" class="msg"></div>
      </form>
    </div>
  </div>

  {% include 'partials/_footer.html' %}

  <script>
    const form = document.getElementById('form-veiculo');
    const mensagem = document.getElementById('mensagem');
    const maisTarde = document.getElementById('mais-tarde');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensagem.className = 'msg';

      const dados = {
        placa: document.getElementById('placa').value,
        marca: document.getElementById('marca').value,
        modelo: document.getElementById('modelo').value,
        ano: document.getElementById('ano').value,
        capacidade_bateria_kwh: document.getElementById('capacidade').value,
      };

      try {
        const resposta = await fetch('/api/veiculo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados),
        });
        const resultado = await resposta.json();

        if (!resposta.ok) {
          mensagem.textContent = resultado.erro || 'Não foi possível salvar o veículo.';
          mensagem.className = 'msg erro';
          return;
        }

        mensagem.textContent = resultado.mensagem + ' Redirecionando...';
        mensagem.className = 'msg sucesso';
        setTimeout(() => window.location.href = resultado.redirect || '/painel', 900);
      } catch (err) {
        mensagem.textContent = 'Erro de conexão com o servidor.';
        mensagem.className = 'msg erro';
      }
    });

    maisTarde.addEventListener('click', () => {
      window.location.href = '/painel';
    });
  </script>

</body>

</html>
